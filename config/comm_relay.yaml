comm_relay:
  ros__parameters:
    # Source topic, published by scout2map_event (S2M-Event-Engine)
    events_topic: /events

    # Custom WebSocket server, NOT rosbridge - one-way JSON push to
    # Web-Monitoring with connect/disconnect buffering. Bind 0.0.0.0 so the
    # local AP can reach it from the operator's laptop.
    ws_host: 0.0.0.0
    ws_port: 9091

    # Buffer bounds while no web client is connected. Oldest entries are
    # dropped first once either bound is hit; the client is told how many
    # were dropped on reconnect.
    buffer_max_len: 500
    buffer_max_age_s: 1800.0

    # Local ROS heartbeat of relay/link health, independent of whether any
    # web client is currently attached (std_msgs/String, JSON)
    link_status_topic: /relay/link_status
    link_status_period_s: 2.0

    # websockets library keepalive, catches half-open TCP connections
    # (Wi-Fi roams, AP hiccups) faster than waiting for a send to fail
    ws_ping_interval_s: 10.0
    ws_ping_timeout_s: 10.0

    # /map is best-effort (latest wins) - unlike /events it is NOT buffered
    # while no client is connected, only the most recent grid is kept and
    # handed to whoever connects next.
    map_topic: /map

    # Occupancy grids are much bigger than an event and don't need to be
    # fresh to the second, so we only relay the latest one at most this
    # often even if SLAM republishes faster. Raise this if the map still
    # feels like too much bandwidth on a weak AP link.
    map_relay_period_s: 2.0

    # zlib compression level (0-9) applied to the grid bytes before sending.
    # Occupancy grids are mostly runs of the same value (-1/0/100) so this
    # typically shrinks them a lot; 6 is zlib's own default (good ratio
    # without burning much CPU on the Pi). Raise toward 9 if bandwidth still
    # hurts and the Pi has CPU to spare, lower toward 1 if it's the reverse.
    map_zlib_level: 6

    # return_home_node's captured start pose + state machine (s2m_bringup).
    # Both are latched (TRANSIENT_LOCAL) so a relay started after the last
    # publish still picks up the current value.
    return_home_pose_topic: /return_home/start_pose
    return_home_status_topic: /return_home/status

    # explore_lite's own cmd_vel output. _stop_explore_mission publishes a
    # zero-velocity Twist here on stop, on top of killing the subprocess.
    explore_cmd_vel_topic: /cmd_vel

    # Link-quality auto-adjust: pings the connected web client every
    # link_quality_check_period_s and measures round-trip time. Crossing
    # link_rtt_degraded_ms for link_quality_hysteresis_checks consecutive
    # checks pushes scout_vision to LINK_QUALITY_PROFILES['degraded']
    # (lower max_fps + smaller/lower-quality snapshots, see
    # comm_relay_node.py) and stretches this node's own telemetry
    # broadcast period out to telemetry_relay_period_s_degraded; dropping
    # back under link_rtt_good_ms for the same number of checks restores
    # 'good'. Widen the good/degraded gap if the tier flaps on a marginal
    # link, or shorten link_quality_check_period_s to react faster at the
    # cost of a slightly heavier ping load on the link itself.
    link_quality_check_period_s: 2.0
    link_rtt_good_ms: 250.0
    link_rtt_degraded_ms: 800.0
    link_quality_hysteresis_checks: 2
    telemetry_relay_period_s_degraded: 15.0
